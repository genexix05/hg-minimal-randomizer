name: Build release package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Build plug-and-play package
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeRandoZX-HGMinimal
          path: |
            dist/PokeRandoZX-HGMinimal.zip
            dist/PokeRandoZX-HGMinimal.jar

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PokeRandoZX-HGMinimal.zip
            dist/PokeRandoZX-HGMinimal.jar
          generate_release_notes: true
          body: |
            ## Download
            Grab **PokeRandoZX-HGMinimal.zip**, extract, run the launcher for your OS.
            No extra downloads needed (Java/JRE required, same as UPR ZX).

            Do not redistribute ROMs with this tool.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
